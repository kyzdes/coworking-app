# SwiftLint Configuration for Virtual Office Pomodoro

# Excluded paths
excluded:
  - Pods
  - .build
  - DerivedData
  - Package.swift

# Disabled rules
disabled_rules:
  - trailing_whitespace
  - todo
  - line_length

# Opt-in rules
opt_in_rules:
  - empty_count
  - empty_string
  - explicit_init
  - fatal_error_message
  - file_header
  - first_where
  - modifier_order
  - redundant_nil_coalescing
  - sorted_first_last
  - unused_import
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces

# Rule configurations
identifier_name:
  min_length:
    warning: 2
    error: 1
  max_length:
    warning: 50
    error: 60
  excluded:
    - id
    - URL
    - url

type_name:
  min_length: 3
  max_length:
    warning: 50
    error: 60
  excluded:
    - ID

file_length:
  warning: 500
  error: 1000
  ignore_comment_only_lines: true

function_body_length:
  warning: 50
  error: 100

type_body_length:
  warning: 300
  error: 500

cyclomatic_complexity:
  warning: 15
  error: 25

nesting:
  type_level:
    warning: 2
  statement_level:
    warning: 5

# Custom rules
custom_rules:
  double_space:
    name: "Double space"
    regex: '([a-z,A-Z] \s+)'
    message: "Double space between words"
    match_kinds:
      - comment
      - doccomment

  comments_space:
    name: "Space After Comment"
    regex: '(^ *//\w+)'
    message: "There should be a space after //"

  empty_first_line:
    name: "Empty First Line"
    regex: '(^[ a-zA-Z ]*(?:protocol|extension|class|struct) (?![ a-zA-Z:]*\{))'
    message: "There should be an empty line after a declaration"

# Warnings vs Errors
force_cast: warning
force_try: warning

# Reporter
reporter: "xcode"
